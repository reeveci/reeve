---
type: pipeline
name: build image - docker.io/reeveci/reeve

when:
  workerGroup: { include: [soldier@midgar] }
  trigger: { include: [commit, action] }
  file:
    include:
      - config.env
      - .reeve.yaml
    match:
      - ^reeve-server/docker/
  action: { include: [images:docker.io/reeveci/reeve:build] }

steps:
  - name: load env
    task: "@reeve/load-env-file"
    params:
      FILES: config.env
      LOAD_ALL: "true"

  - name: build image - docker.io/reeveci/reeve
    task: "@docker/build"
    params:
      DOCKER_LOGIN_REGISTRIES: { env: docker/hub/reeve/login }
      NAME: docker.io/reeveci/reeve
      TAG: { var: REEVE_VERSION }
      FILE: reeve-server/docker/Dockerfile
      CONTEXT: .
      PLATFORM: amd64,arm64
      BUILD_DRIVER: docker-container

